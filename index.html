<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UN Daily</title>
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UN Daily">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f3ec; --paper: #fffdf8; --ink: #1d2128; --muted: #6b6f78; --line: #e4dfd3;
  --accent: #0b6fa4; --accent-soft: #e3f0f7; --ko: #3d5a4a; --ko-bg: #eef4ee;
  --serif: "Source Serif 4", Georgia, serif;
  --sans: Inter, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --paper: #1c2027; --ink: #e9e6df; --muted: #9a9ea8; --line: #2c313a;
    --accent: #5db7e8; --accent-soft: #1d3140; --ko: #a8cfb6; --ko-bg: #1f2b25;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
  font-size: 16px; line-height: 1.55; padding-bottom: env(safe-area-inset-bottom);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: var(--accent); }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }

/* 머리 */
header {
  position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top);
}
.bar { max-width: 640px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px; }
.brand { font-family: var(--serif); font-weight: 600; font-size: 19px; letter-spacing: .01em; margin-right: auto; }
.brand b { color: var(--accent); font-weight: 600; }
.datenav { display: flex; align-items: center; gap: 2px; }
.datenav button { width: 36px; height: 36px; border-radius: 10px; font-size: 18px; }
.datenav button:disabled { opacity: .25; cursor: default; }
.datenav button:not(:disabled):active { background: var(--line); }
.datebtn { width: auto !important; padding: 0 10px; font-size: 14px !important; font-weight: 600; font-variant-numeric: tabular-nums; }

h2.sec {
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  font-weight: 600; margin: 28px 0 12px; display: flex; align-items: center; gap: 10px;
}
h2.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* 뉴스 카드 */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 12px; margin-bottom: 12px; }
.meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.num { font-family: var(--serif); font-size: 13px; font-weight: 600; color: var(--accent); }
.card h3 { font-size: 18px; line-height: 1.35; margin: 0 0 8px; font-weight: 700; letter-spacing: -.01em; }
.card p.en { margin: 0; font-size: 16px; }
.tools { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.chip {
  font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.ko { background: var(--ko-bg); color: var(--ko); border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 15px; }
.vocab { margin: 10px 0 0; padding: 0; list-style: none; border-top: 1px dashed var(--line); }
.vocab li { display: flex; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.vocab li b { font-weight: 600; flex: 0 0 46%; }
.vocab li span { color: var(--muted); }
[hidden] { display: none !important; }

/* 결의문 */
.res { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 20px 18px; }
.symbol { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); padding: 3px 9px; border-radius: 6px; }
.res h3 { font-family: var(--serif); font-size: 21px; line-height: 1.3; margin: 10px 0 2px; font-weight: 600; }
.res .topic-ko { color: var(--muted); font-size: 14px; margin: 0; }
.res .adopted { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
.res-tools { display: flex; gap: 6px; margin: 14px 0 6px; flex-wrap: wrap; }
.opening { font-family: var(--serif); font-size: 18px; margin: 18px 0 10px; }
.para { display: block; width: 100%; text-align: left; padding: 10px 0 10px 14px; border-left: 2px solid var(--line); margin: 0 0 6px; }
.para .en { font-family: var(--serif); font-size: 17px; line-height: 1.6; }
.para .en i { font-style: italic; font-weight: 600; }
.para .ko { font-family: var(--sans); }
.para[aria-expanded="true"] { border-left-color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
.res .vocab { margin-top: 18px; }
.res .vocab li b { font-family: var(--serif); font-style: italic; }

/* 지난 날짜 */
.archive { list-style: none; margin: 0; padding: 0; }
.archive li button { width: 100%; text-align: left; padding: 14px 4px; border-bottom: 1px solid var(--line); display: block; }
.archive .d { font-weight: 700; font-variant-numeric: tabular-nums; }
.archive .d small { color: var(--accent); font-weight: 600; margin-left: 8px; }
.archive .h { font-size: 13px; color: var(--muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.empty { color: var(--muted); text-align: center; padding: 60px 0; }
/* 단어장 */
.wbtn { font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.para { -webkit-user-select: text; user-select: text; cursor: pointer; }
/* 단어 선택 시 화면 아래 고정 막대 */
#selbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(0,0,0,.18);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  transform: translateY(110%); transition: transform .18s ease-out;
}
#selbar.show { transform: none; }
#selbar .in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
#selbar .txt { flex: 1; min-width: 0; }
#selbar .sw { font-family: var(--serif); font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#selbar .sk { font-size: 14px; color: var(--ko); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#addword { background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; padding: 11px 16px; border-radius: 12px; white-space: nowrap; }
#toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); font-size: 14px; padding: 10px 16px; border-radius: 12px;
  opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; white-space: nowrap;
}
#toast.show { opacity: 1; }
.wb-tools { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.word { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
.word .top { display: flex; align-items: baseline; gap: 10px; }
.word .w { font-family: var(--serif); font-size: 20px; font-weight: 600; flex: 1; }
.word .del { color: var(--muted); font-size: 18px; padding: 0 4px; }
.word input {
  width: 100%; margin-top: 6px; font: inherit; font-size: 15px; color: var(--ko); background: var(--ko-bg);
  border: 1px solid transparent; border-radius: 8px; padding: 7px 10px;
}
.word input:focus { outline: none; border-color: var(--accent); }
.word input::placeholder { color: var(--muted); }
.hide-ko .word input { color: transparent; }
.hide-ko .word input:focus { color: var(--ko); }
.word .ctx { font-family: var(--serif); font-size: 15px; margin: 8px 0 4px; color: var(--ink); }
.word .ctx mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 2px; }
.word .src { font-size: 12px; color: var(--muted); }
.word .src button { color: var(--accent); font-size: 12px; padding: 0; }
footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 32px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">UN <b>Daily</b></div>
    <button class="wbtn" id="wbtn">단어장</button>
    <div class="datenav">
      <button id="prev" aria-label="이전 날짜">‹</button>
      <button id="datebtn" class="datebtn" aria-label="지난 날짜 목록"></button>
      <button id="next" aria-label="다음 날짜">›</button>
    </div>
  </div>
</header>
<div id="selbar"><div class="in">
  <div class="txt"><div class="sw"></div><div class="sk"></div></div>
  <button id="addword">＋ 단어장</button>
</div></div>
<div id="toast"></div>
<main class="wrap" id="app"><p class="empty">불러오는 중…</p></main>

<script>
const app = document.getElementById("app");
let index = [];
let current = null;

const esc = (s = "") => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDate = (d) => {
  const [y, m, day] = d.split("-").map(Number);
  const w = "일월화수목금토"[new Date(y, m - 1, day).getDay()];
  return `${m}월 ${day}일 (${w})`;
};
const ago = (iso) => {
  const h = Math.round((Date.now() - new Date(iso)) / 3600e3);
  return h < 1 ? "방금" : h < 24 ? `${h}시간 전` : `${Math.round(h / 24)}일 전`;
};
async function getJSON(url) {
  const r = await fetch(url, { cache: "no-cache" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function vocabList(v) {
  return `<ul class="vocab">${v.map((x) => `<li><b>${esc(x.en)}</b><span>${esc(x.ko)}</span></li>`).join("")}</ul>`;
}

function newsCard(n, i) {
  return `<article class="card" data-src="${esc(n.headline)}">
    <div class="meta"><span class="num">${String(i + 1).padStart(2, "0")}</span>·<span>${esc(n.source)}</span>·<span>${ago(n.published)}</span></div>
    <h3>${esc(n.headline)}</h3>
    <p class="en">${esc(n.summary_en)}</p>
    <div class="ko" hidden>${n.headline_ko ? `<b>${esc(n.headline_ko)}</b><br>` : ""}${esc(n.summary_ko)}</div>
    <div hidden data-v>${vocabList(n.vocab)}</div>
    <div class="tools">
      <button class="chip" data-toggle="ko" aria-pressed="false">해석</button>
      <button class="chip" data-toggle="v" aria-pressed="false">어휘 ${n.vocab.length}</button>
      <a class="chip" href="${esc(n.url)}" target="_blank" rel="noopener">원문 ↗</a>
    </div>
  </article>`;
}

function resolutionView(r) {
  const paras = r.paragraphs.map((p, i) => {
    const rest = p.en.slice(p.lead.length);
    return `<div class="para" role="button" tabindex="0" aria-expanded="false" data-i="${i}">
      <div class="en"><i>${esc(p.lead)}</i>${esc(rest)}</div>
      <div class="ko" hidden>${esc(p.ko)}</div>
    </div>`;
  }).join("");
  return `<section class="res" data-src="${esc(r.symbol)}">
    <span class="symbol">${esc(r.symbol)}</span>
    <h3>${esc(r.topic_en || r.title)}</h3>
    <p class="topic-ko">${esc(r.topic_ko || "")}</p>
    <p class="adopted">${esc(r.body)} · ${esc(r.adopted)} 채택 · 서문 ${r.paragraphs.length}문단</p>
    <div class="res-tools">
      <button class="chip" id="allko" aria-pressed="false">해석 모두 보기</button>
      <a class="chip" href="${esc(r.pdf_url)}" target="_blank" rel="noopener">원문 PDF ↗</a>
    </div>
    <p class="opening"><i>${esc(r.opening)}</i></p>
    <p class="hint">문단을 누르면 해석이 나와요</p>
    ${paras}
    <h2 class="sec">UN 표현</h2>
    ${vocabList(r.vocab)}
  </section>`;
}

async function showDay(date) {
  current = date;
  location.hash = date;
  const pos = index.findIndex((d) => d.date === date);
  document.getElementById("prev").disabled = pos >= index.length - 1;
  document.getElementById("next").disabled = pos <= 0;
  document.getElementById("datebtn").textContent = fmtDate(date);
  app.innerHTML = `<p class="empty">불러오는 중…</p>`;
  try {
    const day = await getJSON(`data/days/${date}.json`);
    glossary = new Map();
    const addGloss = (list) => (list || []).forEach((g) => glossary.set(norm(g.en), g.ko));
    day.news.forEach((n) => { addGloss(n.glossary); addGloss(n.vocab); });
    let resHtml = `<p class="empty">결의문을 불러오지 못했어요</p>`;
    if (day.resolution) {
      const file = day.resolution.replace(/[^A-Za-z0-9]+/g, "_").replace(/_$/, "") + ".json";
      try {
        const r = await getJSON(`data/resolutions/${file}`);
        addGloss(r.glossary); addGloss(r.vocab);
        resHtml = resolutionView(r);
      } catch {}
    }
    app.innerHTML = `
      <h2 class="sec">Today's News</h2>
      ${day.news.map(newsCard).join("") || `<p class="empty">뉴스가 없어요</p>`}
      <h2 class="sec">UN Resolution · Preamble</h2>
      ${resHtml}
      <footer>매일 오전 9시 업데이트 · 요약과 해석은 AI가 작성</footer>`;
    window.scrollTo(0, 0);
  } catch {
    app.innerHTML = `<p class="empty">이 날짜의 자료를 불러오지 못했어요</p>`;
  }
}

function showArchive() {
  current = null;
  location.hash = "archive";
  document.getElementById("prev").disabled = true;
  document.getElementById("next").disabled = true;
  document.getElementById("datebtn").textContent = "지난 날짜";
  app.innerHTML = `<h2 class="sec">Archive</h2><ul class="archive">${index.map((d, i) => `
    <li><button data-date="${d.date}">
      <div class="d">${fmtDate(d.date)}${i === 0 ? "<small>최신</small>" : ""}</div>
      <div class="h">${esc(d.headlines.join(" · "))}${d.resolution ? " · " + esc(d.resolution) : ""}</div>
    </button></li>`).join("")}</ul>`;
}

app.addEventListener("click", (e) => {
  const t = e.target.closest("[data-toggle], .para, #allko, [data-date]");
  if (!t) return;
  if (t.dataset.date) return showDay(t.dataset.date);
  if (t.id === "allko") {
    const on = t.getAttribute("aria-pressed") !== "true";
    t.setAttribute("aria-pressed", on);
    app.querySelectorAll(".para").forEach((p) => { p.setAttribute("aria-expanded", on); p.querySelector(".ko").hidden = !on; });
    return;
  }
  if (t.classList.contains("para")) {
    if (String(getSelection())) return;
    const on = t.getAttribute("aria-expanded") !== "true";
    t.setAttribute("aria-expanded", on);
    t.querySelector(".ko").hidden = !on;
    return;
  }
  const card = t.closest(".card");
  const on = t.getAttribute("aria-pressed") !== "true";
  t.setAttribute("aria-pressed", on);
  card.querySelector(t.dataset.toggle === "ko" ? ".ko" : "[data-v]").hidden = !on;
});

// ---------- 단어장 ----------
const WKEY = "undaily-words-v1";
let glossary = new Map();
const norm = (w) => w.toLowerCase().replace(/[’']/g, "'").replace(/[^a-z' -]/g, " ").replace(/\s+/g, " ").trim();
const stem = (w) => w.replace(/(ies)$/, "y").replace(/(ing|ed|es|s)$/, "");
function loadWords() { try { return JSON.parse(localStorage.getItem(WKEY)) || []; } catch { return []; } }
function saveWords(list) { try { localStorage.setItem(WKEY, JSON.stringify(list)); } catch {} updateWcount(); }
function updateWcount() { const n = loadWords().length; document.getElementById("wbtn").textContent = n ? `단어장 ${n}` : "단어장"; }
function lookup(word) {
  const k = norm(word);
  if (glossary.has(k)) return glossary.get(k);
  for (const [g, ko] of glossary) if (stem(g) === stem(k) && !g.includes(" ") === !k.includes(" ")) return ko;
  // 단어가 풀이된 구 안에 들어 있으면 그 구의 뜻 (예: peacekeeping → peacekeeping mission)
  for (const [g, ko] of glossary) if (g.split(" ").some((x) => x === k || stem(x) === stem(k))) return `${ko} (${g})`;
  return "";
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1600);
}

const addBtn = document.getElementById("addword");
const selbar = document.getElementById("selbar");
const hideBar = () => { selbar.classList.remove("show"); picked = null; };
let picked = null;
function sentenceOf(text, word) {
  const parts = text.replace(/\s+/g, " ").match(/[^.!?]+[.!?]*[”"']?/g) || [text];
  return (parts.find((p) => p.includes(word)) || text).trim();
}
function checkSelection() {
  const sel = getSelection();
  const word = String(sel).replace(/\s+/g, " ").trim().replace(/^[^A-Za-z]+|[^A-Za-z]+$/g, "");
  const host = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
  const block = host && host.closest(".en, .card h3, .opening");
  if (!word || word.length > 60 || !/[A-Za-z]/.test(word) || !block || !sel.rangeCount) {
    hideBar(); return;
  }
  const src = block.closest("[data-src]");
  picked = { word, ctx: sentenceOf(block.textContent, word), src: src ? src.dataset.src : "", date: current };
  const ko = lookup(word);
  selbar.querySelector(".sw").textContent = word;
  selbar.querySelector(".sk").textContent = ko || "뜻은 단어장에서 적을 수 있어요";
  selbar.classList.add("show");
}
document.addEventListener("selectionchange", () => { clearTimeout(checkSelection.t); checkSelection.t = setTimeout(checkSelection, 200); });
addBtn.addEventListener("pointerdown", (e) => e.preventDefault()); // 선택이 풀리지 않게
addBtn.addEventListener("click", () => {
  if (!picked) return;
  const list = loadWords();
  if (list.some((w) => norm(w.word) === norm(picked.word))) { toast("이미 단어장에 있어요"); }
  else {
    list.unshift({ id: Date.now(), word: picked.word, ko: lookup(picked.word), ctx: picked.ctx, src: picked.src, date: picked.date, added: new Date().toISOString() });
    saveWords(list);
    toast(`‘${picked.word}’ 추가했어요`);
  }
  hideBar();
  getSelection().removeAllRanges();
});

function showWords() {
  current = null;
  location.hash = "words";
  hideBar();
  document.getElementById("prev").disabled = true;
  document.getElementById("next").disabled = true;
  document.getElementById("datebtn").textContent = "← 오늘";
  const list = loadWords();
  const hl = (ctx, w) => {
    const i = ctx.toLowerCase().indexOf(w.toLowerCase());
    return i < 0 ? esc(ctx) : esc(ctx.slice(0, i)) + "<mark>" + esc(ctx.slice(i, i + w.length)) + "</mark>" + esc(ctx.slice(i + w.length));
  };
  app.innerHTML = `<h2 class="sec">My Words · ${list.length}</h2>
    ${list.length ? `<div class="wb-tools">
      <button class="chip" id="hideko" aria-pressed="false">뜻 가리기</button>
      <button class="chip" id="copyall">전체 복사</button>
    </div>` : `<p class="empty">아직 단어가 없어요<br><br>뉴스나 결의문에서 단어를 꾹 눌러 선택하면<br>‘＋ 단어장’ 버튼이 나와요</p>`}
    <div id="wlist">${list.map((w) => `<div class="word" data-id="${w.id}">
      <div class="top"><span class="w">${esc(w.word)}</span><button class="del" aria-label="삭제">✕</button></div>
      <input value="${esc(w.ko || "")}" placeholder="뜻 적기 (자동으로 못 찾았어요)">
      ${w.ctx ? `<p class="ctx">${hl(w.ctx, w.word)}</p>` : ""}
      <div class="src">${w.date ? `<button data-date="${w.date}">${fmtDate(w.date)}</button> · ` : ""}${esc(w.src || "")}</div>
    </div>`).join("")}</div>`;
  window.scrollTo(0, 0);
}
app.addEventListener("change", (e) => {
  const card = e.target.closest(".word");
  if (!card || e.target.tagName !== "INPUT") return;
  const list = loadWords(); const w = list.find((x) => String(x.id) === card.dataset.id);
  if (w) { w.ko = e.target.value.trim(); saveWords(list); }
});
app.addEventListener("click", (e) => {
  if (e.target.closest(".del")) {
    const card = e.target.closest(".word");
    saveWords(loadWords().filter((x) => String(x.id) !== card.dataset.id));
    card.remove(); toast("삭제했어요");
    document.querySelector("h2.sec").textContent = `My Words · ${loadWords().length}`;
  } else if (e.target.id === "hideko") {
    const on = e.target.getAttribute("aria-pressed") !== "true";
    e.target.setAttribute("aria-pressed", on);
    document.getElementById("wlist").classList.toggle("hide-ko", on);
  } else if (e.target.id === "copyall") {
    const text = loadWords().map((w) => `${w.word}\t${w.ko || ""}\t${w.ctx || ""}`).join("\n");
    navigator.clipboard.writeText(text).then(() => toast("복사했어요 · 메모장에 붙여넣으면 백업돼요"), () => toast("복사하지 못했어요"));
  }
});
document.getElementById("wbtn").onclick = showWords;
updateWcount();

document.getElementById("prev").onclick = () => { const i = index.findIndex((d) => d.date === current); if (index[i + 1]) showDay(index[i + 1].date); };
document.getElementById("next").onclick = () => { const i = index.findIndex((d) => d.date === current); if (i > 0) showDay(index[i - 1].date); };
document.getElementById("datebtn").onclick = () => (current ? showArchive() : index[0] && showDay(index[0].date));

(async () => {
  try { index = await getJSON("data/index.json"); } catch { index = []; }
  if (!index.length) { app.innerHTML = `<p class="empty">아직 자료가 없어요</p>`; return; }
  const h = location.hash.slice(1);
  if (h === "archive") showArchive();
  else if (h === "words") showWords();
  else showDay(index.some((d) => d.date === h) ? h : index[0].date);
})();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
